<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:image" content="https://lyre.hexly.ai/opengraph-image.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lyre - Audio Transcription Manager</title>
    <meta
      name="description"
      content="Upload, transcribe, and explore your audio recordings with word-level precision."
    />
    <!-- Blocking script: apply dark class before first paint to prevent FOUC -->
    <script>
      (() => {
        try {
          const s = localStorage.getItem("theme");
          const d = window.matchMedia("(prefers-color-scheme:dark)").matches;
          const isDark = s === "dark" || (s !== "light" && d);
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.classList.toggle("light", !isDark);
          document.documentElement.dataset.mode = isDark ? "dark" : "light";
        } catch {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
