name: Lyre
options:
  bundleIdPrefix: ai.hexly.lyre
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.40"
  createIntermediateGroups: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    LYRE_RUN_LIVE_RECORDING: "0"

targets:
  Lyre:
    type: application
    platform: macOS
    sources:
      - path: Lyre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.hexly.lyre
        PRODUCT_NAME: Lyre
        MARKETING_VERSION: "1.8.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Lyre/Info.plist
        CODE_SIGN_ENTITLEMENTS: Lyre/Lyre.entitlements
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 93WWLTN9XU
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Release:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: ""

  LyreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LyreTests
    dependencies:
      - target: Lyre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.hexly.lyre.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 93WWLTN9XU

# Test actions use an empty Debug host. Run/Profile/Archive retain the app.
schemes:
  Lyre:
    build:
      targets:
        Lyre: all
    test:
      config: Debug
      targets:
        - LyreTests
      environmentVariables:
        LYRE_TEST_HOST: "1"
        LYRE_RUN_LIVE_RECORDING: "$(LYRE_RUN_LIVE_RECORDING)"
  LyreTests:
    build:
      targets:
        Lyre: [test]
        LyreTests: [test]
    test:
      config: Debug
      targets:
        - LyreTests
      environmentVariables:
        LYRE_TEST_HOST: "1"
        LYRE_RUN_LIVE_RECORDING: "$(LYRE_RUN_LIVE_RECORDING)"
