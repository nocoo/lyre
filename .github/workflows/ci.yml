name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  l1-hook-selftest:
    name: "L1: hook self-test"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@633a5545fcfec91b688840650d4edf3e9cc1abbd
        with:
          package-manager: bun
          runtime-version: "1.4.0"
          install-policy: trusted

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.24.2
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Run L1 hook self-test
        run: bun run gate:l1-selftest

  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd # v2026.10
    with:
      runtime-version: "1.4.0"
      install-policy: "trusted"
      coverage-path: "coverage"
      prepare-command: "bun run build"
      test-command: "bun run test:coverage"
      typecheck-command: "bun run typecheck"
      l2: true
      l2-command: "bun run test:e2e"
      l3: true
      l3-command: "bun run test:e2e:bdd"
