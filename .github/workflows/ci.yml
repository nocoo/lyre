# CI slot standard v1 (nocoo/base-ci docs/slots.md): impl S1–G2, B1, L1, L2, L3, Z1 via quality.yml;
# na L1.5, P1 in slot-status. nocoo/base-ci v2026.12: top-level slot jobs, L2/L3 browsers/artifacts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l1-hook-selftest:
    name: "L1: hook self-test"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
        with:
          package-manager: bun
          runtime-version: "1.4.0"
          install-policy: trusted

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.24.2
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Run L1 hook self-test
        run: bun run gate:l1-selftest

  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      runtime-version: "1.4.0"
      node-version: "26.12.1"
      install-policy: trusted
      coverage-path: coverage
      prepare-command: bun run build
      test-command: bun run test:coverage
      typecheck-command: bun run typecheck
      gitleaks-config: .gitleaks.toml
      build: true
      build-command: bun run build
      workflow-lint: true
      workflow-lint-required-workflow: nocoo/base-ci/.github/workflows/deploy-worker.yml
      workflow-lint-yamllint: true
      l2: true
      l2-command: bun run test:e2e
      l3: true
      l3-browsers: chromium
      l3-prepare-command: bun run build
      l3-command: bun run test:e2e:bdd
      l3-artifact-name: browser-evidence
      l3-artifact-path: |
        playwright-report/
        test-results/bdd/
      l3-artifact-retention-days: 14
      env-json: '{"WRANGLER_SEND_METRICS": "false", "CI": "true"}'
      slot-status: >-
        {"S1": {"status": "impl"},
        "S2": {"status": "impl"},
        "S3": {"status": "impl"},
        "G1": {"status": "impl"},
        "G2": {"status": "impl"},
        "B1": {"status": "impl"},
        "L1": {"status": "impl"},
        "L1.5": {"status": "na", "reason": "未接入 @cloudflare/vitest-pool-workers / miniflare Worker 运行时单测；L2/L3 以 wrangler dev 起服务"},
        "L2": {"status": "impl"},
        "L3": {"status": "impl"},
        "P1": {"status": "na", "reason": "根 package.json 为 private，不发布 npm 包"},
        "Z1": {"status": "impl"}}
