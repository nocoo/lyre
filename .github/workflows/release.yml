name: Release

# Production CD is driven by a successful CI run on `main` (workflow_run) or by
# a manual dispatch that names a proven CI run / an already released tag.
#
# A `push` tag trigger is intentionally absent: a tag pushed while the same
# commit's main CI is still running loses the fail-closed release-source proof
# ("No successful .github/workflows/ci.yml run on main for <sha>"), and a tag
# pushed after CI passes deploys the same commit a second time. Tags are
# pushed by `scripts/release.ts` only after CI and the matching deployment
# have succeeded.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source-run-id:
        description: "Successful CI run ID on main to deploy (omit when tag is given)"
        required: false
        type: string
      tag:
        description: "Released tag to deploy (e.g. v2.1.9); omit when source-run-id is given"
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy Worker
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
    with:
      required-quality-check: "quality / Z1: Gate"
      expected-workflow-path: ".github/workflows/ci.yml"
      expected-workflow-name: "CI"
      source-run-id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || inputs.source-run-id }}
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
      package-version-match: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
      runtime-version: "1.4.0"
      install-policy: "blocked"
      build-command: "bun run web:build"
      wrangler-working-directory: "apps/api"
      d1-migrations: true
      d1-command: "d1 execute lyre-db --remote --file ../../packages/api/migrations/0002_transcription_job_indexes.sql"
      environment: production
      concurrency-group: deploy-worker-production
      timeout-minutes: 15
      verify-command: |
        EXPECTED=$(jq -r .version package.json)
        HTTP=$(curl -fsS -o /tmp/live.json -w "%{http_code}" https://lyre.hexly.ai/api/live || echo "000")
        ACTUAL=$(jq -r .version /tmp/live.json 2>/dev/null || echo "?")
        test "$HTTP" = "200" && test "$ACTUAL" = "$EXPECTED"
      verify-retries: 6
      verify-retry-seconds: 5
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
