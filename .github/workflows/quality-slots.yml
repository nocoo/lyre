name: Quality

on:
  workflow_call:
    outputs:
      tested-sha:
        value: ${{ jobs.z1-gate.outputs.tested-sha }}

permissions:
  contents: read
  actions: read

env:
  BUN_VERSION: "1.4.0"
  NODE_VERSION: "26.12.1"
  WRANGLER_SEND_METRICS: "false"
  CI: "true"

jobs:
  s1-types:
    name: "S1: Types"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@6424d395d36a815d931f10e557762eb635d511c0 # v2026.16
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: trusted
      - run: bun run typecheck

  s2-lint:
    name: "S2: Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@6424d395d36a815d931f10e557762eb635d511c0 # v2026.16
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: trusted
      - run: bun run lint

  s2-swift-lint:
    name: "SwiftLint (macOS)"
    runs-on: macos-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/swiftlint
          key: ${{ runner.os }}-swiftlint-0.65.1
      - name: Install verified SwiftLint
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/share/swiftlint"
          echo "${HOME}/.local/share/swiftlint" >> "$GITHUB_PATH"
          export PATH="${HOME}/.local/share/swiftlint:${PATH}"
          if ! command -v swiftlint >/dev/null || [ "$(swiftlint version)" != "0.65.1" ]; then
            curl -fsSL -o /tmp/swiftlint.zip \
              https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
            echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  /tmp/swiftlint.zip" | shasum -a 256 -c -
            rm -rf "${HOME}/.local/share/swiftlint"
            mkdir -p "${HOME}/.local/share/swiftlint"
            unzip -q /tmp/swiftlint.zip -d "${HOME}/.local/share/swiftlint"
          fi
          test "$(swiftlint version)" = "0.65.1"
      - name: Run SwiftLint
        working-directory: apps/macos
        run: swiftlint lint --strict

  s3-workflow:
    name: "S3: Workflow"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check SHA-pinned workflow actions
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const dir = ".github/workflows";
            const shaRe = /@[0-9a-f]{40}(\s|$|#)/;
            const bad = [];
            for (const f of fs.readdirSync(dir)) {
              if (!f.endsWith(".yml") && !f.endsWith(".yaml")) continue;
              const text = fs.readFileSync(path.join(dir, f), "utf8");
              for (const m of text.matchAll(/^\s*-?\s*uses:\s*([^\s#]+)/gm)) {
                const ref = m[1];
                if (ref.startsWith("./")) continue;
                if (!shaRe.test(ref)) bad.push(`${f}: ${ref}`);
              }
            }
            if (bad.length) {
              console.error("Unpinned uses:\n" + bad.join("\n"));
              process.exit(1);
            }
          '

  g1-secrets:
    name: "G1: Secrets"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-security-scanners@6424d395d36a815d931f10e557762eb635d511c0 # v2026.16
      - run: gitleaks dir . --no-banner --redact --log-level error --config .gitleaks.toml

  g2-dependencies:
    name: "G2: Dependencies"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-security-scanners@6424d395d36a815d931f10e557762eb635d511c0 # v2026.16
      - run: osv-scanner scan --lockfile=bun.lock

  b1-build:
    name: "B1: Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@6424d395d36a815d931f10e557762eb635d511c0 # v2026.16
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: trusted
      - run: bun run build

  l1-unit:
    name: "L1: Unit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@6424d395d36a815d931f10e557762eb635d511c0 # v2026.16
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: trusted
      - run: bun run build && bun run test:coverage

  l2-runtime:
    name: "L2: Runtime"
    if: ${{ vars.ENABLE_L2_RUNTIME == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "N/A - L3/L4 use wrangler dev"

  l3-integration:
    name: "L3: Integration"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@6424d395d36a815d931f10e557762eb635d511c0 # v2026.16
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: trusted
      - run: bun run build && bun run test:e2e

  l4-e2e:
    name: "L4: E2E"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@6424d395d36a815d931f10e557762eb635d511c0 # v2026.16
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: trusted
      - run: bun run build && bunx playwright install --with-deps chromium && bun run test:e2e:bdd
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/bdd/
          retention-days: 14

  p1-package:
    name: "P1: Package"
    if: ${{ vars.ENABLE_P1_PACKAGE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "N/A - private monorepo, not published to npm"

  l1-hook-selftest:
    name: "Hook self-test"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@6424d395d36a815d931f10e557762eb635d511c0 # v2026.16
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: trusted
      - uses: nocoo/base-ci/.github/actions/setup-security-scanners@6424d395d36a815d931f10e557762eb635d511c0 # v2026.16
      - run: bun run gate:l1-selftest

  z1-gate:
    name: "Z1: Gate"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - s1-types
      - s2-lint
      - s3-workflow
      - g1-secrets
      - g2-dependencies
      - b1-build
      - l1-unit
      - l2-runtime
      - l3-integration
      - l4-e2e
      - p1-package
      - l1-hook-selftest
      - s2-swift-lint
    outputs:
      tested-sha: ${{ github.sha }}
    steps:
      - name: Verify all quality slots
        run: |
          echo "s1-types: ${{ needs.s1-types.result }}"
          echo "s2-lint: ${{ needs.s2-lint.result }}"
          echo "s2-swift-lint: ${{ needs.s2-swift-lint.result }}"
          echo "s3-workflow: ${{ needs.s3-workflow.result }}"
          echo "g1-secrets: ${{ needs.g1-secrets.result }}"
          echo "g2-dependencies: ${{ needs.g2-dependencies.result }}"
          echo "b1-build: ${{ needs.b1-build.result }}"
          echo "l1-unit: ${{ needs.l1-unit.result }}"
          echo "l2-runtime: ${{ needs.l2-runtime.result }}"
          echo "l3-integration: ${{ needs.l3-integration.result }}"
          echo "l4-e2e: ${{ needs.l4-e2e.result }}"
          echo "p1-package: ${{ needs.p1-package.result }}"
          echo "l1-hook-selftest: ${{ needs.l1-hook-selftest.result }}"
          for r in \
            "${{ needs.s1-types.result }}" \
            "${{ needs.s2-lint.result }}" \
            "${{ needs.s2-swift-lint.result }}" \
            "${{ needs.s3-workflow.result }}" \
            "${{ needs.g1-secrets.result }}" \
            "${{ needs.g2-dependencies.result }}" \
            "${{ needs.b1-build.result }}" \
            "${{ needs.l1-unit.result }}" \
            "${{ needs.l3-integration.result }}" \
            "${{ needs.l4-e2e.result }}" \
            "${{ needs.l1-hook-selftest.result }}"; do
            if [ "$r" != "success" ]; then
              echo "Required slot failed or was skipped: $r"
              exit 1
            fi
          done
          for r in \
            "${{ needs.l2-runtime.result }}" \
            "${{ needs.p1-package.result }}"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "Optional slot failed: $r"
              exit 1
            fi
          done
